name: Build Rafiq Al-Quran Android

on:
  workflow_dispatch:

  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build APK and AAB
    runs-on: ubuntu-latest

    steps:

      # ==========================================
      # 1. تحميل المشروع من GitHub
      # ==========================================
      - name: Checkout repository
        uses: actions/checkout@v4

      # ==========================================
      # 2. إعداد Java
      # ==========================================
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      # ==========================================
      # 3. البحث عن ZIP وفك الضغط إن وجد
      # ==========================================
      - name: Extract Flutter project
        shell: bash
        run: |
          set -e

          echo "======================================"
          echo "Searching for Flutter project / ZIP..."
          echo "======================================"

          mkdir -p extracted

          ZIP_FILE=$(find . \
            -type f \
            \( -name "*.zip" -o -name "*.ZIP" \) \
            -not -path "./.git/*" \
            | head -n 1 || true)

          if [ -n "$ZIP_FILE" ]; then
            echo "ZIP found: $ZIP_FILE"
            echo "Extracting ZIP..."

            unzip -q "$ZIP_FILE" -d extracted

            echo "ZIP extracted successfully."
          else
            echo "No ZIP file found."
            echo "Using repository files directly."
          fi

      # ==========================================
      # 4. العثور على Flutter project
      # ==========================================
      - name: Find Flutter project
        shell: bash
        run: |
          set -e

          echo "Searching for pubspec.yaml..."

          PROJECT_DIR=$(find . \
            -type f \
            -name "pubspec.yaml" \
            -not -path "./.git/*" \
            | head -n 1 \
            | xargs -r dirname)

          if [ -z "$PROJECT_DIR" ]; then
            echo ""
            echo "ERROR: pubspec.yaml was not found."
            echo ""
            echo "Make sure your Flutter project contains:"
            echo "pubspec.yaml"
            echo ""
            echo "Repository files:"
            find . -maxdepth 3 -type f | sort
            exit 1
          fi

          PROJECT_DIR=$(realpath "$PROJECT_DIR")

          echo "Flutter project found:"
          echo "$PROJECT_DIR"

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      # ==========================================
      # 5. تثبيت Flutter
      # ==========================================
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      # ==========================================
      # 6. Flutter version
      # ==========================================
      - name: Flutter version
        run: |
          flutter --version

      # ==========================================
      # 7. إصلاح صلاحيات Gradle
      # ==========================================
      - name: Prepare Gradle
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          if [ -f "android/gradlew" ]; then
            chmod +x android/gradlew
          fi

          chmod +x "$GITHUB_WORKSPACE/$PROJECT_DIR/android/gradlew" 2>/dev/null || true

      # ==========================================
      # 8. تحميل Dependencies
      # ==========================================
      - name: Get Flutter dependencies
        run: |
          set -e

          cd "$PROJECT_DIR"

          flutter pub get

      # ==========================================
      # 9. تحليل المشروع
      # ==========================================
      - name: Analyze Flutter project
        run: |
          set +e

          cd "$PROJECT_DIR"

          flutter analyze

          ANALYZE_EXIT=$?

          if [ $ANALYZE_EXIT -ne 0 ]; then
            echo "Warning: flutter analyze reported issues."
            echo "Continuing with Android build..."
          fi

          exit 0

      # ==========================================
      # 10. بناء APK Release
      # ==========================================
      - name: Build Release APK
        run: |
          set -e

          cd "$PROJECT_DIR"

          flutter build apk --release

      # ==========================================
      # 11. بناء AAB Release
      # ==========================================
      - name: Build Release AAB
        run: |
          set -e

          cd "$PROJECT_DIR"

          flutter build appbundle --release

      # ==========================================
      # 12. تجهيز ملفات الإصدار
      # ==========================================
      - name: Prepare artifacts
        shell: bash
        run: |
          set -e

          mkdir -p "$GITHUB_WORKSPACE/release"

          APK_FILE="$PROJECT_DIR/build/app/outputs/flutter-apk/app-release.apk"
          AAB_FILE="$PROJECT_DIR/build/app/outputs/bundle/release/app-release.aab"

          if [ -f "$APK_FILE" ]; then
            cp "$APK_FILE" \
              "$GITHUB_WORKSPACE/release/Rafiq-Al-Quran-release.apk"
          else
            echo "ERROR: APK file not found."
            exit 1
          fi

          if [ -f "$AAB_FILE" ]; then
            cp "$AAB_FILE" \
              "$GITHUB_WORKSPACE/release/Rafiq-Al-Quran-release.aab"
          else
            echo "ERROR: AAB file not found."
            exit 1
          fi

          echo ""
          echo "======================================"
          echo "Release files:"
          echo "======================================"

          ls -lh "$GITHUB_WORKSPACE/release"

      # ==========================================
      # 13. رفع APK
      # ==========================================
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Rafiq-Al-Quran-APK
          path: release/Rafiq-Al-Quran-release.apk
          if-no-files-found: error

      # ==========================================
      # 14. رفع AAB
      # ==========================================
      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: Rafiq-Al-Quran-AAB
          path: release/Rafiq-Al-Quran-release.aab
          if-no-files-found: error

      # ==========================================
      # 15. رفع الإصدار كاملًا
      # ==========================================
      - name: Upload Complete Release
        uses: actions/upload-artifact@v4
        with:
          name: Rafiq-Al-Quran-Complete-Release
          path: release/
          if-no-files-found: error
