name: Build Rafiq Al-Quran Android

on:
  workflow_dispatch:

  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build APK and AAB
    runs-on: ubuntu-latest

    steps:

      # ==========================================
      # 1. تحميل المشروع من GitHub
      # ==========================================
      - name: Checkout repository
        uses: actions/checkout@v4

      # ==========================================
      # 2. إعداد Java
      # ==========================================
      # ملاحظة:
      # لا نستخدم cache: gradle هنا لأن المشروع
      # قد لا يحتوي على Gradle Wrapper في الجذر.
      # ==========================================
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # ==========================================
      # 3. البحث عن ZIP وفك الضغط إن وجد
      # ==========================================
      - name: Extract Flutter project
        shell: bash
        run: |
          set -e

          echo "======================================"
          echo "Searching for Flutter project / ZIP..."
          echo "======================================"

          mkdir -p "$GITHUB_WORKSPACE/extracted"

          ZIP_FILE=$(find "$GITHUB_WORKSPACE" \
            -type f \
            \( -name "*.zip" -o -name "*.ZIP" \) \
            -not -path "$GITHUB_WORKSPACE/.git/*" \
            | head -n 1 || true)

          if [ -n "$ZIP_FILE" ]; then
            echo "ZIP found:"
            echo "$ZIP_FILE"

            echo "Extracting ZIP..."

            unzip -q "$ZIP_FILE" \
              -d "$GITHUB_WORKSPACE/extracted"

            echo "ZIP extracted successfully."
          else
            echo "No ZIP file found."
            echo "Using repository files directly."
          fi

      # ==========================================
      # 4. العثور على Flutter project
      # ==========================================
      - name: Find Flutter project
        shell: bash
        run: |
          set -e

          echo "======================================"
          echo "Searching for pubspec.yaml..."
          echo "======================================"

          PROJECT_DIR=$(find "$GITHUB_WORKSPACE" \
            -type f \
            -name "pubspec.yaml" \
            -not -path "$GITHUB_WORKSPACE/.git/*" \
            | head -n 1 \
            | xargs -r dirname)

          if [ -z "$PROJECT_DIR" ]; then
            echo ""
            echo "ERROR: pubspec.yaml was not found."
            echo ""

            echo "Make sure your Flutter project contains:"
            echo "pubspec.yaml"
            echo ""

            echo "Repository files:"
            find "$GITHUB_WORKSPACE" \
              -maxdepth 4 \
              -type f \
              -not -path "$GITHUB_WORKSPACE/.git/*" \
              | sort

            exit 1
          fi

          PROJECT_DIR=$(realpath "$PROJECT_DIR")

          echo ""
          echo "======================================"
          echo "Flutter project found:"
          echo "$PROJECT_DIR"
          echo "======================================"

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      # ==========================================
      # 5. تثبيت Flutter
      # ==========================================
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      # ==========================================
      # 6. عرض إصدارات Flutter و Dart و Java
      # ==========================================
      - name: Show build environment
        shell: bash
        run: |
          echo "======================================"
          echo "Flutter"
          echo "======================================"
          flutter --version

          echo ""
          echo "======================================"
          echo "Dart"
          echo "======================================"
          dart --version

          echo ""
          echo "======================================"
          echo "Java"
          echo "======================================"
          java -version

      # ==========================================
      # 7. فحص بنية مشروع Android
      # ==========================================
      - name: Check Android project
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          echo "======================================"
          echo "Project directory"
          echo "======================================"
          pwd

          echo ""
          echo "======================================"
          echo "Project files"
          echo "======================================"

          ls -la

          echo ""
          echo "======================================"
          echo "Android directory"
          echo "======================================"

          if [ -d "android" ]; then
            ls -la android
          else
            echo "ERROR: android directory not found."
            exit 1
          fi

      # ==========================================
      # 8. تجهيز Gradle
      # ==========================================
      - name: Prepare Gradle
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          echo "======================================"
          echo "Preparing Gradle"
          echo "======================================"

          if [ -f "android/gradlew" ]; then
            echo "Gradle Wrapper found."

            chmod +x "android/gradlew"

            echo ""
            echo "Gradle Wrapper version:"
            cd android
            ./gradlew --version

          else
            echo ""
            echo "WARNING:"
            echo "android/gradlew was not found."

            echo ""
            echo "Flutter will attempt to use the Android project"
            echo "configuration during the build."
          fi

      # ==========================================
      # 9. تحميل Flutter Dependencies
      # ==========================================
      - name: Get Flutter dependencies
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          echo "======================================"
          echo "Running flutter pub get"
          echo "======================================"

          flutter pub get

      # ==========================================
      # 10. تحليل المشروع
      # ==========================================
      - name: Analyze Flutter project
        shell: bash
        run: |
          cd "$PROJECT_DIR"

          echo "======================================"
          echo "Running flutter analyze"
          echo "======================================"

          set +e

          flutter analyze

          ANALYZE_EXIT=$?

          if [ "$ANALYZE_EXIT" -ne 0 ]; then
            echo ""
            echo "WARNING:"
            echo "flutter analyze reported issues."
            echo "Continuing with Android build..."
          else
            echo ""
            echo "Flutter analyze completed successfully."
          fi

          exit 0

      # ==========================================
      # 11. تنظيف المشروع
      # ==========================================
      - name: Flutter clean
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          echo "======================================"
          echo "Cleaning Flutter project"
          echo "======================================"

          flutter clean

          echo "Getting dependencies again..."

          flutter pub get

      # ==========================================
      # 12. بناء APK Release
      # ==========================================
      - name: Build Release APK
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          echo "======================================"
          echo "Building Release APK"
          echo "======================================"

          flutter build apk --release

          echo ""
          echo "APK build completed."

      # ==========================================
      # 13. بناء AAB Release
      # ==========================================
      - name: Build Release AAB
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          echo "======================================"
          echo "Building Release AAB"
          echo "======================================"

          flutter build appbundle --release

          echo ""
          echo "AAB build completed."

      # ==========================================
      # 14. تجهيز ملفات الإصدار
      # ==========================================
      - name: Prepare release files
        shell: bash
        run: |
          set -e

          echo "======================================"
          echo "Preparing release files"
          echo "======================================"

          mkdir -p "$GITHUB_WORKSPACE/release"

          APK_FILE="$PROJECT_DIR/build/app/outputs/flutter-apk/app-release.apk"
          AAB_FILE="$PROJECT_DIR/build/app/outputs/bundle/release/app-release.aab"

          # --------------------------------------
          # APK
          # --------------------------------------

          if [ -f "$APK_FILE" ]; then

            cp "$APK_FILE" \
              "$GITHUB_WORKSPACE/release/Rafiq-Al-Quran-release.apk"

            echo "APK copied successfully."

          else

            echo "ERROR: APK file not found:"
            echo "$APK_FILE"

            exit 1

          fi

          # --------------------------------------
          # AAB
          # --------------------------------------

          if [ -f "$AAB_FILE" ]; then

            cp "$AAB_FILE" \
              "$GITHUB_WORKSPACE/release/Rafiq-Al-Quran-release.aab"

            echo "AAB copied successfully."

          else

            echo "ERROR: AAB file not found:"
            echo "$AAB_FILE"

            exit 1

          fi

          # --------------------------------------
          # عرض الملفات
          # --------------------------------------

          echo ""
          echo "======================================"
          echo "Release files"
          echo "======================================"

          ls -lh "$GITHUB_WORKSPACE/release"

      # ==========================================
      # 15. رفع APK
      # ==========================================
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Rafiq-Al-Quran-APK
          path: release/Rafiq-Al-Quran-release.apk
          if-no-files-found: error

      # ==========================================
      # 16. رفع AAB
      # ==========================================
      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: Rafiq-Al-Quran-AAB
          path: release/Rafiq-Al-Quran-release.aab
          if-no-files-found: error

      # ==========================================
      # 17. رفع APK + AAB معًا
      # ==========================================
      - name: Upload Complete Release
        uses: actions/upload-artifact@v4
        with:
          name: Rafiq-Al-Quran-Complete-Release
          path: release/
          if-no-files-found: error
